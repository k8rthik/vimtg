version: 2
updates:
  # uv.lock and pyproject.toml (dependabot's "uv" ecosystem keeps the lock in
  # sync; "pip" would update pyproject.toml but leave uv.lock stale).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns: ["pytest*", "ruff", "mypy"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
