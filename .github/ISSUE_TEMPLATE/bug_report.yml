name: Bug report
description: Something in vimtg is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check existing issues first.
        For security problems, do **not** open an issue — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Open a deck with `vimtg burn.deck`
        2. Press `dd` on a card line
        3. Expected ..., but ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: vimtg version
      description: Output of `vimtg --version`.
      placeholder: "vimtg, version 1.0.0rc1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.1 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal emulator
      description: Key handling and rendering vary by terminal (and tmux/screen).
      placeholder: "iTerm2 3.5, kitty 0.36, Windows Terminal, inside tmux 3.4 ..."
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version` for the interpreter running vimtg.
      placeholder: "3.12.7"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install vimtg?
      options:
        - pipx
        - uv tool
        - pip
        - from a git checkout
        - other
  - type: textarea
    id: deck
    attributes:
      label: Deck file
      description: |
        If the bug involves a specific deck, paste the `.deck` file (or the
        smallest excerpt that reproduces it). Remove anything private.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Traceback or screenshot
      description: Any error output, traceback, or a screenshot of the screen.
      render: text
