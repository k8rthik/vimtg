name: CI

on:
  push:
    branches: [main, nightly]
  pull_request:
  workflow_dispatch:
  # release.yml runs this whole workflow as its gate before publishing
  workflow_call:

permissions:
  contents: read

concurrency:
  # "ci-" keeps this group distinct from release.yml's own when it calls
  # this workflow (group names are case-insensitive).
  # A newer push to a PR branch supersedes its old run. main and nightly get a
  # group per commit: GitHub cancels a *pending* run whenever a newer one
  # queues in the same group, so a shared group would drop the middle of
  # three quick merges even with cancel-in-progress off.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nightly') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/nightly' }}

defaults:
  run:
    shell: bash

env:
  UV_PYTHON_DOWNLOADS: automatic
  # Keep any accidental auto-sync off the network in CI (tests set it too).
  VIMTG_NO_AUTOSYNC: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src/ tests/
      - run: uv run mypy --strict src/

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      # Shared runners are noisy; perf tests catch order-of-magnitude
      # regressions, not drift. macOS/Windows runners get more headroom.
      VIMTG_PERF_BUDGET_SCALE: ${{ matrix.os == 'ubuntu-latest' && '3' || '10' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: pytest (coverage gate 92%)
        run: >-
          uv run pytest
          --cov=vimtg --cov-report=term-missing:skip-covered
          --cov-fail-under=92

  lowest-direct:
    name: Test (lowest direct dependencies)
    runs-on: ubuntu-latest
    env:
      VIMTG_PERF_BUDGET_SCALE: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      # Resolves every direct dependency to its declared floor, proving the
      # lower bounds in pyproject.toml are real. Not locked by design.
      - run: uv sync --resolution lowest-direct --extra dev
      - run: uv pip list
      - run: uv run --no-sync pytest

  build:
    name: Build and smoke-test dists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv build
      - name: twine check
        run: uvx twine check --strict dist/*
      - name: sdist carries no dev scaffolding
        run: |
          tar -tzf dist/*.tar.gz > sdist.txt
          if grep -E '/(\.claude|\.github|scripts)/' sdist.txt; then
            echo "::error::sdist contains dev scaffolding"
            exit 1
          fi
      - name: Install wheel in a clean venv and smoke-test
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/smoke"
          VIRTUAL_ENV="$RUNNER_TEMP/smoke" uv pip install dist/*.whl
          cd "$RUNNER_TEMP"
          expected=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/src/vimtg/__init__.py")
          "$RUNNER_TEMP/smoke/bin/vimtg" --version | tee out.txt
          grep -F "$expected" out.txt
          "$RUNNER_TEMP/smoke/bin/python" -m vimtg --version
          "$RUNNER_TEMP/smoke/bin/vimtg" new Smoke -o smoke.deck
          "$RUNNER_TEMP/smoke/bin/vimtg" info smoke.deck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
