[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vimtg"
dynamic = ["version"]
description = "Vim-powered TUI Magic: The Gathering deck builder"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Keerthik Muruganandam", email = "keerthik.4.m@gmail.com" }]
keywords = [
    "mtg",
    "magic-the-gathering",
    "deck-builder",
    "vim",
    "tui",
    "terminal",
    "textual",
    "scryfall",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "textual>=2.0,<9",
    "click>=8.1,<9",
    "httpx>=0.27,<1",
    "rich>=13.3.3,<16",
]

[project.urls]
Homepage = "https://github.com/k8rthik/vimtg"
Source = "https://github.com/k8rthik/vimtg"
Issues = "https://github.com/k8rthik/vimtg/issues"
Changelog = "https://github.com/k8rthik/vimtg/blob/main/CHANGELOG.md"
Documentation = "https://github.com/k8rthik/vimtg/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
vimtg = "vimtg.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-socket: tests may only connect to loopback (asyncio's self-pipe on
# Windows needs it), so nothing can reach Scryfall/EDHREC by accident.
addopts = ["--strict-markers", "--allow-hosts=127.0.0.1,::1"]
markers = [
    "perf: timing-sensitive budget assertions; scale with VIMTG_PERF_BUDGET_SCALE",
]
filterwarnings = [
    # Surface leaked sqlite connections as test failures rather than noise.
    "error::ResourceWarning",
]

[tool.hatch.version]
# Single source of truth: vimtg.__version__. pyproject no longer carries a
# literal version, so the two cannot drift.
path = "src/vimtg/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vimtg"]

[tool.hatch.build.targets.sdist]
# Ship what is needed to build, test, and read about vimtg; leave out dev
# scaffolding (agent prompts, editor/assistant config, CI-only files).
only-include = [
    "src/vimtg",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "pyproject.toml",
    "uv.lock",
]
exclude = [
    "**/__pycache__",
    "**/*.py[co]",
    "docs/_build",
    "docs/site",
]
